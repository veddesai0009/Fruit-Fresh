{% extends "layout.html" %}

{% block content %}

<div class="card card-success">

    <div class="card-header">
        <h3 class="card-title">Add New Fruit</h3>
    </div>

    <form method="POST" enctype="multipart/form-data">

        <div class="card-body">

            {% if error %}
            <div class="alert alert-danger">
                {{ error }}
            </div>
            {% endif %}

            
             <!-- Fruit Name -->
            <div class="form-group">
                <label>Fruit Name</label>

               <input
    type="text"
    class="form-control"
    name="fruit_name"
    
    placeholder="Enter Fruit Name"
    required
    minlength="2"
    maxlength="30"
    pattern="^[A-Za-z]+( [A-Za-z]+)*$"
    title="Only letters are allowed, with a single space between words. Multiple or leading/trailing spaces are not allowed."
    oninput="
        this.value = this.value
        .replace(/[^A-Za-z ]/g,'')
        .replace(/\s{2,}/g,' ')
        .replace(/^\s/g,'');
    ">
            </div>
            <!-- Price -->
            <div class="form-group">
                <label>Price</label>

                <input
                    type="number"
                    class="form-control"
                    name="price"
                    placeholder="Enter Price"
                    min="1"
                    step="1"
                    required>
            </div>

            <!-- Category -->
            <div class="form-group">
                <label>Category</label>

                <select
                    class="form-control"
                    name="category"
                    required>

                    <option value="">Select Category</option>
                    <option value="Fresh Fruits">Fresh Fruits</option>
                    <option value="Seasonal">Seasonal</option>

                </select>
            </div>

            <!-- Stock -->
            <div class="form-group">
                <label>Stock</label>

                <input
                    type="number"
                    class="form-control"
                    name="stock"
                    placeholder="Enter Stock"
                    min="0"
                    step="1"
                    required>
            </div>

            <!-- Fruit Image -->
            <div class="form-group">
                <label>Fruit Image</label>

                <input
                    type="file"
                    class="form-control"
                    name="image"
                    accept=".jpg,.jpeg,.png,.webp"
                    required>
            </div>

        </div>

        <div class="card-footer">

            <button type="submit" class="btn btn-success">
                Save Fruit
            </button>

            <a href="/fruit-list" class="btn btn-secondary">
                Cancel
            </a>

        </div>

    </form>

</div>

{% endblock %}
