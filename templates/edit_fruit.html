{% extends "layout.html" %}

{% block content %}

<div class="card card-primary">

    <div class="card-header">
        <h3 class="card-title">Edit Fruit</h3>
    </div>

    <form method="POST" enctype="multipart/form-data">

        <div class="card-body">

            {% if error %}
            <div class="alert alert-danger">
                {{ error }}
            </div>
            {% endif %}

            <!-- Fruit Name -->
            <div class="form-group">
                <label>Fruit Name</label>

               <input
    type="text"
    class="form-control"
    name="fruit_name"
    value="{{ fruit['fruit_name'] if fruit else '' }}"
    placeholder="Enter Fruit Name"
    required
    minlength="2"
    maxlength="30"
    pattern="^[A-Za-z]+( [A-Za-z]+)*$"
    title="Only letters are allowed, with a single space between words. Multiple or leading/trailing spaces are not allowed."
    oninput="
        this.value = this.value
        .replace(/[^A-Za-z ]/g,'')
        .replace(/\s{2,}/g,' ')
        .replace(/^\s/g,'');
    ">
            </div>

            <!-- Price -->
            <div class="form-group">
                <label>Price</label>

                <input
                    type="number"
                    class="form-control"
                    name="price"
                    value="{{ fruit['price'] }}"
                    min="1"
                    step="1"
                    required>
            </div>

            <!-- Category -->
            <div class="form-group">
                <label>Category</label>

                <select
                    class="form-control"
                    name="category"
                    required>

                    <option value="Fresh Fruits"
                        {% if fruit['category']=="Fresh Fruits" %}selected{% endif %}>
                        Fresh Fruits
                    </option>

                    <option value="Seasonal"
                        {% if fruit['category']=="Seasonal" %}selected{% endif %}>
                        Seasonal
                    </option>

                </select>
            </div>

            <!-- Stock -->
            <div class="form-group">
                <label>Stock</label>

                <input
                    type="number"
                    class="form-control"
                    name="stock"
                    value="{{ fruit['stock'] }}"
                    min="0"
                    step="1"
                    required>
            </div>

            <!-- Current Image -->
            <div class="form-group">

                <label>Current Image</label>

                <br>

                {% if fruit["image"] %}
                    <img src="{{ url_for('static', filename='uploads/' + fruit['image']) }}"
                         width="120"
                         class="img-thumbnail mb-3">
                {% else %}
                    <p class="text-muted">No image uploaded.</p>
                {% endif %}

            </div>

            <!-- Upload New Image -->
            <div class="form-group">

                <label>Change Image (Optional)</label>

                <input
                    type="file"
                    class="form-control"
                    name="image"
                    accept=".jpg,.jpeg,.png,.webp">

                <small class="text-muted">
                    Leave empty if you don't want to change the image.
                </small>

            </div>

        </div>

        <div class="card-footer">

            <button type="submit" class="btn btn-primary">
                Update Fruit
            </button>

            <a href="/fruit-list" class="btn btn-secondary">
                Cancel
            </a>

        </div>

    </form>

</div>

{% endblock %}
